name: test

on:
  push:
  pull_request:

jobs:
  # unittest and browser each run as three slices on separate machines; the run is green only when every slice is.
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      COLLECTOR_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unittest slice
        run: python chanapp/scripts/unittest_shard.py ${{ matrix.shard }}/3

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JS UI tests
        run: bash chanapp/scripts/test_js.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: |
          npm ci
          npx --no-install e2e-web install chromium --with-deps
      - name: Run user flow acceptance
        run: PYTHON=python npm run test:e2e -- --shard ${{ matrix.shard }}/3
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
          path: |
            .e2e/report.json
            .e2e/artifacts/
            .e2e/logs/
            tmp/demo-offline-browser/demo.png

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
