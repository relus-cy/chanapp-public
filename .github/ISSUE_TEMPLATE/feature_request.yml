name: 功能建议
description: 新功能或现有行为的改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
